<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Llamamaps - Expert Local SEO Services. Get your business to the top of Google Maps in 90 days. Guaranteed results." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://llamamaps.com/" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Webfonts are self-hosted (see the @font-face block at the top of
         src/index.css), so there is no fonts.googleapis.com/fonts.gstatic.com
         connection left to warm. Preloading the body font here starts it during
         HTML parse, in parallel with the stylesheet that references it, instead
         of one round trip after it. crossorigin is required even same-origin:
         fonts are always fetched in CORS mode, and without it the preload is
         discarded and fetched a second time. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Third-party origins the app connects to. These stay dns-prefetch rather
         than preconnect: nothing on the critical path uses them, and the video
         embeds are click-to-load, so youtube.com is only reached on interaction. -->
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://assets.calendly.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/llama-logo.png" />
    <link rel="shortcut icon" type="image/png" href="/llama-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3467e8" />
    <meta name="apple-mobile-web-app-title" content="Llamamaps" />

    <title>Llamamaps | Expert Local SEO Services - Top Google Maps Rankings</title>
    <meta name="author" content="Llamamaps" />
    <meta property="og:title" content="Llamamaps | Expert Local SEO Services - Top Google Maps Rankings" />
    <meta property="og:description" content="Llamamaps - Expert Local SEO Services. Get your business to the top of Google Maps in 90 days. Guaranteed results." />
    <meta property="og:type" content="website" />
    <!-- Absolute URLs: Facebook, X and LinkedIn scrapers do not resolve relative image paths. -->
    <meta property="og:url" content="https://llamamaps.com/" />
    <meta property="og:image" content="https://llamamaps.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Llamamaps — expert local SEO for top Google Maps rankings" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Llamamaps" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Llamamaps | Expert Local SEO Services - Top Google Maps Rankings" />
    <meta name="twitter:description" content="Llamamaps - Expert Local SEO Services. Get your business to the top of Google Maps in 90 days. Guaranteed results." />
    <meta name="twitter:image" content="https://llamamaps.com/og-image.png" />

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1664540361284269');
    fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
