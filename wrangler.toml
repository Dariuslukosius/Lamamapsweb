# Cloudflare Pages project configuration.
#
# `pages_build_output_dir` is what makes this a Pages project rather than a
# Worker: wrangler uploads that directory, and Cloudflare picks up dist/_headers
# and dist/_redirects from inside it.
#
# This repo now builds one deployment: llamamaps.com, target "main" (see
# scripts/deployTargets.mjs and CLEANUP-TRIAL-ONLY-PROMPT.md — /trial and
# /landingpage used to be separate Pages projects built from here too; they are
# a different codebase's job now). Build with `npm run build:com` or
# `node scripts/build.mjs com`, deploy with `wrangler pages deploy dist`.
name = "llamamaps"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-22"
